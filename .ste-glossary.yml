  # ---- This daemon's own concepts ----
  - word: timeout
    approved_meaning: How long to wait before an action starts.
  - word: timeouts
    approved_meaning: The times to wait before an action starts.
  - word: idle-lock
    approved_meaning: The action that locks the session after the user is idle.
  - word: before-sleep
    approved_meaning: Said of the lock that must happen before the machine sleeps.
  - word: sleep
    approved_meaning: The low-power state the machine goes into; also the logind concept of that state.
  - word: spawn
    approved_meaning: To start a new process.
  - word: policy
    approved_meaning: The rules this daemon applies to idle events.
  - word: module
    approved_meaning: One source file of this project, holding one of its three concerns.
  - word: state machine
