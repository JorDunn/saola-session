  - word: KillMode
    approved_meaning: The systemd unit setting that says which processes to kill when the unit stops.
  - word: ConditionEnvironment
    approved_meaning: The systemd unit setting that runs a unit only when a variable has a given value.
  - word: unit
    approved_meaning: One systemd service definition.
  - word: enablement
    approved_meaning: The step that makes systemd start a unit automatically.
