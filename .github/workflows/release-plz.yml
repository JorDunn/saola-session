name: Release-plz

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches: [main]

# Never run two release-plz jobs at once — they push commits and tags.
concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  # Tags + GitHub releases for any crate whose version was bumped on main
  # (i.e. after a release PR merges).
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Skip prerelease versions — a divergence from the siblings, which were
      # wired up at real versions. This crate sits at `0.1.0-dev` until the
      # Jordan-run suspend/resume test passes (CHANGELOG's Unreleased note:
      # "Tagging 0.1.0 is Jordan's call"), and without this gate release-plz
      # tags and publishes `saola-session-v0.1.0-dev` on the first push. When
      # the version loses its `-dev` suffix, this job tags and releases it.
      - name: Check for a releasable (non-prerelease) version
        id: ver
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "$v" in
            *-*) echo "release=false" >> "$GITHUB_OUTPUT"
                 echo "Prerelease version $v — skipping release" ;;
            *)   echo "release=true" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ver.outputs.release == 'true'
      - uses: release-plz/action@v0.5
        if: steps.ver.outputs.release == 'true'
        with:
          command: release
        env:
          # RELEASE_PLZ_TOKEN is an optional fine-grained PAT (contents +
          # pull-requests: write). Without it the default token works, but
          # PRs it opens won't trigger the CI workflow.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}

  # Opens/updates the release PR: version bump + changelog entry, derived from
  # conventional commits since the last tag.
  #
  # Runs the release-plz CLI directly instead of release-plz/action because we
  # must pass --registry-manifest-path: this crate is not on crates.io, so the
  # default (registry-based) version detection would conclude "already
  # up-to-date" forever after the first tag (release-plz.toml's semver_check
  # NOTE anticipates exactly this wiring). A checkout of the latest tag is the
  # released baseline instead. Copied from saola-panel's release-plz.yml; only
  # the tag --match pattern differs. (Unlike the panel, this crate has no
  # unpublished git dependency — but the not-on-crates.io problem is the same.)
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Same prerelease gate as the release job above, for the mirror-image
      # reason: with no tag and a `-dev` version, release-plz's initial-release
      # path opens a "release v0.1.0-dev" PR on every push — a release of the
      # placeholder version nobody intends to merge. Both jobs wake up when
      # the `-dev` suffix comes off.
      - name: Check for a releasable (non-prerelease) version
        id: ver
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "$v" in
            *-*) echo "release=false" >> "$GITHUB_OUTPUT"
                 echo "Prerelease version $v — skipping release PR" ;;
            *)   echo "release=true" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ver.outputs.release == 'true'
      - name: Install release-plz
        if: steps.ver.outputs.release == 'true'
        # Same binary the release job's release-plz/action downloads (that
        # action pulls cargo-binstall + cargo-semver-checks too; this is the
        # lighter subset). Pinned to the action's default version.
        run: |
          curl -sSfL -o /tmp/release-plz.tar.gz \
            https://github.com/release-plz/release-plz/releases/download/release-plz-v0.3.160/release-plz-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/release-plz.tar.gz -C /usr/local/bin release-plz
          release-plz --version
      - name: Open or update the release PR
        if: steps.ver.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
        run: |
          # release-pr creates the release commit, which needs a git identity.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=()
          # Baseline = the latest release tag, checked out into a worktree.
          # Before the first release no tag exists and release-plz's
          # initial-release path handles it without a baseline.
          tag=$(git describe --tags --abbrev=0 --match 'saola-session-v*' 2>/dev/null || true)
          if [ -n "$tag" ]; then
            git worktree add --detach ../baseline "$tag"
            args+=(--registry-manifest-path ../baseline/Cargo.toml)
          fi
          release-plz release-pr --git-token "$GITHUB_TOKEN" "${args[@]}"
